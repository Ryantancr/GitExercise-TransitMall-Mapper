<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TransitMall Mapper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .login-card h1 { margin: 0 0 10px 0; color: #0f172a; font-size: 1.5rem; }
        .login-card p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: bold; color: #334155; margin-bottom: 5px; }
        .input-group input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        
        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        
        #errorMsg { color: #ef4444; font-size: 0.85rem; font-weight: bold; margin-top: 15px; display: none; }
        .back-link { display: block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1><i class="fa-solid fa-lock" style="color: #2563eb;"></i> Secure Access</h1>
        <p>TransitMall Mapper Admin Portal</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            <div id="errorMsg">Incorrect username or password.</div>
        </form>
        
        <a href="homepage.html" class="back-link">← Return to Map</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // The Secret Credentials
            if (user === 'admin' && pass === 'transit2026') {
                // Give them the digital VIP wristband
                sessionStorage.setItem('isAdmin', 'true');
                // Send them to the dashboard
                window.location.href = 'admin.html';
            } else {
                // Show error
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
